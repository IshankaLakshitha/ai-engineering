name: Framework quality

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate framework documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate framework
        shell: pwsh
        run: ./scripts/validate-framework.ps1
